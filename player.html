<!DOCTYPE html>
<html>
<head>
  <title>Vinyl Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ffcf7d;
  --accent2:#b06a2b;
}

html, body{
  margin:0;
  height:100%;
  overflow:hidden;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Montserrat',sans-serif;
  color:#f5e6d3;
  background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url("background.jpg") center/cover no-repeat;
}

/* Floating */

.floating{
  position:absolute;
  font-size:40px;
  opacity:0.35;
  pointer-events:none;
}

.obj1{left:8%;animation:floatUp 25s linear infinite;color:#ff8fab;}
.obj2{right:10%;animation:floatDown 30s linear infinite;color:#90e0ef;}
.obj3{top:15%;animation:floatSide 35s linear infinite;color:#ffd166;}
.obj4{left:70%;animation:floatUp 28s linear infinite;color:#caffbf;}
.obj5{right:35%;animation:floatDown 32s linear infinite;color:#bdb2ff;}

@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);}
  100%{transform:translateY(-110vh) rotate(360deg);}
}
@keyframes floatDown{
  0%{transform:translateY(-110vh) rotate(0);}
  100%{transform:translateY(110vh) rotate(-360deg);}
}
@keyframes floatSide{
  0%{transform:translateX(-110vw) rotate(0);}
  100%{transform:translateX(110vw) rotate(360deg);}
}

.wrapper{
  width:90%;
  max-width:400px;
  text-align:center;
}

.stage{
  position:relative;
  width:min(80vw,320px);
  height:min(80vw,320px);
  margin:auto;
}

.shadow{
  position:absolute;
  width:90%;
  height:20%;
  bottom:5%;
  left:50%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,0.6),
    rgba(0,0,0,0) 70%);
  filter:blur(10px);
}

.vinyl{
  position:absolute;
  inset:0;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:spin 6s linear infinite;
  animation-play-state:paused;
  overflow:hidden;
}

.vinyl::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at center,#222 0%,#111 8%,transparent 8%),
    repeating-radial-gradient(circle at center,
      #1a1a1a 0px,
      #1a1a1a 2px,
      #2a2a2a 3px,
      #1a1a1a 4px
    );
  box-shadow:
    0 0 40px rgba(0,0,0,0.85),
    0 0 60px rgba(255,180,100,0.25);
}

.vinyl::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,0.28),
      rgba(255,255,255,0.08) 35%,
      transparent 60%);
}

.label{
  position:absolute;
  width:28%;
  height:28%;
  border-radius:50%;
  background:
    radial-gradient(circle at 40% 35%,
      #d6a77a 0%,
      #b08968 35%,
      #7f5539 70%,
      #5e3b2a 100%);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,0.5),
    0 0 8px rgba(0,0,0,0.4);
  z-index:3;
}

.album{
  width:35%;
  height:35%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #e6ccb2;
  z-index:4;
}

@keyframes spin{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}

/* CLEAN TONEARM */

.tonearm{
  position:absolute;
  width:55%;
  height:55%;
  top:-5%;
  right:-10%;
  transform-origin:85% 18%;
  transform:rotate(-26deg);
  transition:transform 0.7s cubic-bezier(.2,.9,.2,1);
  pointer-events:none;
  z-index:5;
}

.tonearm.playing{
  transform:rotate(-6deg);
}

.tonearm .arm{
  position:absolute;
  right:18%;
  top:16%;
  width:70%;
  height:6%;
  background:#e6e6e6;
  border-radius:999px;
}

.tonearm .pivot{
  position:absolute;
  right:0;
  top:8%;
  width:22%;
  height:22%;
  background:#f2f2f2;
  border-radius:50%;
}

.tonearm .head{
  position:absolute;
  left:5%;
  top:20%;
  width:20%;
  height:16%;
  background:#111;
  border-radius:4px;
}

.tonearm .needle{
  position:absolute;
  left:2%;
  top:38%;
  width:10%;
  height:4%;
  background:var(--accent);
  border-radius:3px;
}

h1{
  font-family:'Playfair Display',serif;
  margin-top:20px;
  font-size:24px;
}

p{
  color:#e6ccb2;
  font-size:14px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-top:10px;
  margin-bottom:5px;
}

.progress-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.3);
  border-radius:5px;
  position:relative;
}

.progress{
  height:100%;
  width:0%;
  background:var(--accent);
  border-radius:5px;
}

.thumb{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:14px;
  height:14px;
  background:var(--accent);
  border-radius:50%;
}

.play-btn{
  margin:20px auto 0 auto;
  width:65px;
  height:65px;
  border-radius:50%;
  background:radial-gradient(circle,var(--accent),var(--accent2));
  box-shadow:0 0 25px rgba(255,180,100,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="floating obj1">📼</div>
<div class="floating obj2">💿</div>
<div class="floating obj3">📻</div>
<div class="floating obj4">🎧</div>
<div class="floating obj5">🎶</div>

<div class="wrapper">

<div class="stage">
  <div class="shadow"></div>

  <div class="vinyl" id="vinyl">
    <div class="label"></div>
    <img id="coverImage" class="album">
  </div>

  <div class="tonearm" id="tonearm">
    <div class="pivot"></div>
    <div class="arm"></div>
    <div class="head"></div>
    <div class="needle"></div>
  </div>
</div>

<h1 id="songTitle"></h1>
<p id="artistName"></p>

<div class="time-row">
  <span id="current">0:00</span>
  <span id="duration">0:00</span>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress" id="progress"></div>
  <div class="thumb" id="thumb"></div>
</div>

<div class="play-btn" id="playBtn">▶</div>

</div>

<audio id="audio"></audio>

<script>
const songs={
  iris:{title:"Iris",artist:"Goo Goo Dolls",file:"iris.mp3",cover:"iris.jpg"},
  floorplan:{title:"Floorplan",artist:"Moon Tang",file:"floorplan.mp3",cover:"floorplan.jpg"},
  "Beautiful Girls":{title:"Beautiful Girls",artist:"Sean Kingston",file:"Beautiful Girls.mp3",cover:"beautifulgirls.jpg"},
  "Can't Leave You Alone":{title:"Can't Leave You Alone",artist:"Maroon 5",file:"Can't Leave You Alone.mp3",cover:"cantleaveyoualone.jpg"},
  "Circles":{title:"Circles",artist:"Post Malone",file:"Circles.mp3",cover:"Circles.jpg"},
  "Closer":{title:"Closer",artist:"The Chainsmokers",file:"Closer.mp3",cover:"Closer.jpg"},
  "death bed":{title:"death bed",artist:"Powfu",file:"death bed.mp3",cover:"death bed.jpg"},
  "Every Breath You Take":{title:"Every Breath You Take",artist:"The Police",file:"Every Breath You Take.mp3",cover:"Every Breath You Take.jpg"},
  "If the World Was Ending":{title:"If the World Was Ending",artist:"JP Saxe & Julia Michaels",file:"If the World Was Ending.mp3",cover:"If the World Was Ending.jpg"},
  "Lucid Dreams":{title:"Lucid Dreams",artist:"Juice WRLD",file:"Lucid Dreams.mp3",cover:"Lucid Dreams.jpg"},
  "Sparks":{title:"Sparks",artist:"Coldplay",file:"Sparks.mp3",cover:"Sparks.jpg"},
  "Sports":{title:"Sports",artist:"Beach Bunny",file:"Sports.mp3",cover:"Sports.jpg"},
  "STAY":{title:"STAY",artist:"The Kid LAROI & Justin Bieber",file:"STAY.mp3",cover:"STAY.jpg"},
  "Strangers":{title:"Strangers",artist:"Kenya Grace",file:"Strangers.mp3",cover:"Strangers.jpg"},
  "Sunflower":{title:"Sunflower",artist:"Post Malone & Swae Lee",file:"Sunflower.mp3",cover:"Sunflower.jpg"},
  "Without Me":{title:"Without Me",artist:"Halsey",file:"Without Me.mp3",cover:"Without Me.jpg"}
};

const params=new URLSearchParams(window.location.search);
const songKey=params.get("song");
const song=songs[songKey];

if(song){
  songTitle.textContent=song.title;
  artistName.textContent=song.artist;
  coverImage.src=song.cover;
  audio.src=song.file;
}

let dragging=false;

function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  return m+":"+(s<10?"0"+s:s);
}

audio.addEventListener("loadedmetadata",()=>{
  duration.textContent=formatTime(audio.duration);
});

function updateUI(percent){
  progress.style.width=percent*100+"%";
  thumb.style.left=percent*100+"%";
  current.textContent=formatTime(audio.currentTime);
}

progressBar.addEventListener("pointerdown",e=>{
  dragging=true;
  progressBar.setPointerCapture(e.pointerId);
  seek(e);
});

progressBar.addEventListener("pointermove",e=>{
  if(dragging) seek(e);
});

progressBar.addEventListener("pointerup",()=>dragging=false);

function seek(e){
  const rect=progressBar.getBoundingClientRect();
  let percent=(e.clientX-rect.left)/rect.width;
  percent=Math.max(0,Math.min(1,percent));
  audio.currentTime=percent*audio.duration;
  updateUI(percent);
}

audio.addEventListener("timeupdate",()=>{
  if(!dragging){
    updateUI(audio.currentTime/audio.duration);
  }
});

playBtn.addEventListener("click",()=>{
  if(audio.paused){audio.play();}
  else{audio.pause();}
});

audio.addEventListener("play",()=>{
  vinyl.style.animationPlayState="running";
  document.getElementById("tonearm").classList.add("playing");
  playBtn.textContent="❚❚";
});

audio.addEventListener("pause",()=>{
  vinyl.style.animationPlayState="paused";
  document.getElementById("tonearm").classList.remove("playing");
  playBtn.textContent="▶";
});
</script>

</body>
</html>
