<!DOCTYPE html>
<html>
<head>
  <title>Iris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ffcf7d;
  --accent2:#b06a2b;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Montserrat',sans-serif;
  color:#f5e6d3;
  overflow:hidden;

  background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url("background.jpg") center/cover no-repeat;
}

/* Disable parallax movement on touch devices */
@media (hover:hover){
  body{
    transition:background-position 0.1s ease-out;
  }
}

/* ========= Floating ========= */

.floating{
  position:absolute;
  font-size:48px;
  opacity:0.35;
  pointer-events:none;
}

.obj1{left:8%;animation:floatUp 25s linear infinite;color:#ff8fab;}
.obj2{right:10%;animation:floatDown 30s linear infinite;color:#90e0ef;}
.obj3{top:15%;animation:floatSide 35s linear infinite;color:#ffd166;}
.obj4{left:70%;animation:floatUp 28s linear infinite;color:#caffbf;}
.obj5{right:35%;animation:floatDown 32s linear infinite;color:#bdb2ff;}

@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);}
  100%{transform:translateY(-110vh) rotate(360deg);}
}
@keyframes floatDown{
  0%{transform:translateY(-110vh) rotate(0);}
  100%{transform:translateY(110vh) rotate(-360deg);}
}
@keyframes floatSide{
  0%{transform:translateX(-110vw) rotate(0);}
  100%{transform:translateX(110vw) rotate(360deg);}
}

/* ========= Stage ========= */

.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:90%;
  max-width:420px;
  text-align:center;
}

.stage{
  position:relative;
  width:min(85vw,360px);
  height:min(85vw,360px);
  display:grid;
  place-items:center;
}

/* Shadow */
.shadow{
  position:absolute;
  width:90%;
  height:20%;
  bottom:5%;
  left:50%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,0.6),
    rgba(0,0,0,0) 70%);
  filter:blur(10px);
  z-index:0;
}

/* Vinyl */

.vinyl{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:spin 6s linear infinite;
  animation-play-state:paused;
  z-index:2;
}

/* Grooves */
.vinyl::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at center,#222 0%,#111 8%,transparent 8%),
    repeating-radial-gradient(circle at center,
      #1a1a1a 0px,
      #1a1a1a 2px,
      #2a2a2a 3px,
      #1a1a1a 4px
    );
  box-shadow:
    0 0 40px rgba(0,0,0,0.85),
    0 0 60px rgba(255,180,100,0.25);
  border-radius:50%;
}

/* ✅ Smooth subtle shine (no sweep) */
.vinyl::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,0.25),
      rgba(255,255,255,0.05) 35%,
      transparent 60%);
  mix-blend-mode:screen;
  pointer-events:none;
}

/* Center label */
.label{
  position:absolute;
  width:28%;
  height:28%;
  border-radius:50%;
  background:radial-gradient(circle,#b08968,#7f5539);
  box-shadow:inset 0 0 16px rgba(0,0,0,0.4);
  z-index:3;
}

.album{
  position:absolute;
  width:35%;
  height:35%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #e6ccb2;
  z-index:4;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* ========= Tonearm ========= */

.tonearm{
  position:absolute;
  width:55%;
  height:55%;
  top:-5%;
  right:-10%;
  transform-origin:85% 18%;
  transform:rotate(-32deg);
  transition:transform 0.7s cubic-bezier(.2,.9,.2,1);
  z-index:5;
}

.playing .tonearm{
  transform:rotate(8deg); /* ✅ Bigger movement */
}

.tonearm .arm{
  position:absolute;
  right:10%;
  top:14%;
  width:80%;
  height:8%;
  border-radius:999px;
  background:linear-gradient(90deg,#cfcfcf,#8f8f8f,#dedede);
}
.tonearm .pivot{
  position:absolute;
  right:0;
  top:5%;
  width:25%;
  height:25%;
  border-radius:50%;
  background:radial-gradient(circle,#d8d8d8,#6f6f6f);
}
.tonearm .head{
  position:absolute;
  left:5%;
  top:20%;
  width:25%;
  height:18%;
  border-radius:6px;
  background:#111;
}
.tonearm .needle{
  position:absolute;
  left:0;
  top:38%;
  width:12%;
  height:3%;
  border-radius:999px;
  background:var(--accent);
}

/* ========= Controls ========= */

h1{
  font-family:'Playfair Display',serif;
  margin-top:20px;
  font-size:26px;
}
p{
  color:#e6ccb2;
  font-size:14px;
}

.progress-container{
  width:100%;
  margin-top:15px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.progress-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.3);
  border-radius:5px;
  position:relative;
  margin-top:6px;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:var(--accent);
  border-radius:5px;
}

.thumb{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:14px;
  height:14px;
  background:var(--accent);
  border-radius:50%;
  cursor:pointer;
}

.play-btn{
  margin-top:20px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:radial-gradient(circle,var(--accent),var(--accent2));
  box-shadow:0 0 25px rgba(255,180,100,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
.play-btn span{
  font-size:24px;
  color:#3b2f2f;
}

</style>
</head>
<body>

<div class="floating obj1">📼</div>
<div class="floating obj2">💿</div>
<div class="floating obj3">📻</div>
<div class="floating obj4">🎧</div>
<div class="floating obj5">🎶</div>

<div class="wrapper" id="wrapper">

<div class="stage">
  <div class="shadow"></div>

  <div class="vinyl" id="vinyl">
    <div class="label"></div>
    <img src="IRIS- goo goo dolls.jpg" class="album">
  </div>

  <div class="tonearm">
    <div class="pivot"></div>
    <div class="arm"></div>
    <div class="head"></div>
    <div class="needle"></div>
  </div>
</div>

<h1>Iris</h1>
<p>Goo Goo Dolls</p>

<div class="progress-container">
  <div class="time-row">
    <span id="current">0:00</span>
    <span id="duration">0:00</span>
  </div>
  <div class="progress-bar" id="progressBar">
    <div class="progress" id="progress"></div>
    <div class="thumb" id="thumb"></div>
  </div>
</div>

<div class="play-btn" id="playBtn">
  <span>▶</span>
</div>

</div>

<audio id="audio">
  <source src="iris.mp3" type="audio/mpeg">
</audio>

<script>
const wrapper=document.getElementById("wrapper");
const audio=document.getElementById("audio");
const vinyl=document.getElementById("vinyl");
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");
const thumb=document.getElementById("thumb");
const progressBar=document.getElementById("progressBar");
const current=document.getElementById("current");
const duration=document.getElementById("duration");

let dragging=false;

function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  return m+":"+(s<10?"0"+s:s);
}

audio.addEventListener("loadedmetadata",()=>{
  duration.textContent=formatTime(audio.duration);
});

audio.addEventListener("timeupdate",()=>{
  if(!dragging){
    const percent=audio.currentTime/audio.duration;
    progress.style.width=percent*100+"%";
    thumb.style.left=percent*100+"%";
    current.textContent=formatTime(audio.currentTime);
  }
});

progressBar.addEventListener("click",(e)=>{
  const rect=progressBar.getBoundingClientRect();
  const percent=(e.clientX-rect.left)/rect.width;
  audio.currentTime=percent*audio.duration;
});

thumb.addEventListener("mousedown",()=>dragging=true);
document.addEventListener("mouseup",()=>dragging=false);

document.addEventListener("mousemove",(e)=>{
  if(dragging){
    const rect=progressBar.getBoundingClientRect();
    let offset=e.clientX-rect.left;
    offset=Math.max(0,Math.min(offset,rect.width));
    const percent=offset/rect.width;
    progress.style.width=percent*100+"%";
    thumb.style.left=percent*100+"%";
    audio.currentTime=percent*audio.duration;
  }
});

playBtn.addEventListener("click",()=>{
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
});

audio.addEventListener("play",()=>{
  vinyl.style.animationPlayState="running";
  wrapper.classList.add("playing");
  playBtn.innerHTML="<span>❚❚</span>";
});

audio.addEventListener("pause",()=>{
  vinyl.style.animationPlayState="paused";
  wrapper.classList.remove("playing");
  playBtn.innerHTML="<span>▶</span>";
});
</script>

</body>
</html>
