<!DOCTYPE html>
<html>
<head>
  <title>Iris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 50% 50%, #4a3a32, #1a1411 80%);
  font-family: 'Montserrat', sans-serif;
  color: #f5e6d3;
}

/* Floating icons - bigger, more colourful, more visible */
.floating-icon {
  position: absolute;
  font-size: 48px; /* Bigger */
  opacity: 0.12;    /* More visible */
  animation: float 25s linear infinite;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
}

@keyframes float {
  from { transform: translateY(110vh) rotate(0deg); }
  to { transform: translateY(-110vh) rotate(360deg); }
}

/* Main player unit */
.player-container {
  position: relative;
  width: 400px;
  height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

/* Hyper-detailed spinning vinyl */
.vinyl-disc {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, #222 2%, #111 3%), /* Spindle hole */
    radial-gradient(circle at center, #b59f84 15%, transparent 15.5%), /* Center label */
    repeating-radial-gradient(circle at center, #2d2d2d, #2d2d2d 1px, #1a1a1a 1px, #1a1a1a 3px); /* Grooves */
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
  animation: spin 8s linear infinite;
  animation-play-state: paused; /* Starts paused */
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Album art centered on vinyl */
.album-art {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  border: 4px solid #b59f84;
  object-fit: cover;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
  z-index: 2;
}

/* Text and controls container */
.controls-container {
  width: 350px;
  text-align: center;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  margin: 10px 0 5px;
}

p {
  font-size: 16px;
  color: #c9b7a3;
  margin-bottom: 25px;
}

/* Interactive Spotify-style progress bar */
.progress-bar-container {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.time {
  font-size: 12px;
  min-width: 40px;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: rgba(245, 230, 211, 0.2);
  border-radius: 5px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: #ffcf7d;
  border-radius: 50%;
  box-shadow: 0 0 5px rgba(255, 207, 125, 0.5);
  margin-top: -5px; /* Center thumb on track */
}

/* Glow button */
.play-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffcf7d, #b06a2b);
  box-shadow: 0 0 25px rgba(255, 180, 100, 0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px auto 0;
  cursor: pointer;
  transition: 0.3s;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn span { font-size: 28px; color: #3b2f2f; }
</style>
</head>

<body>

<!-- Colourful floating icons -->
<div class="floating-icon" style="left:10%; animation-delay:-2s; color:#87CEEB;">📼</div>
<div class="floating-icon" style="left:30%; animation-delay:-8s; color:#98FB98;">💿</div>
<div class="floating-icon" style="left:50%; animation-delay:-15s; color:#FFB6C1;">📻</div>
<div class="floating-icon" style="left:70%; animation-delay:-20s; color:#FFD700;">🎧</div>
<div class="floating-icon" style="left:90%; animation-delay:-5s; color:#DDA0DD;">🎸</div>

<div class="main-wrapper">
  <div class="player-container">
    <div class="vinyl-disc" id="vinyl"></div>
    <img src="IRIS- goo goo dolls.jpg" class="album-art">
  </div>

  <div class="controls-container">
    <h1>Iris</h1>
    <p>Goo Goo Dolls</p>

    <div class="progress-bar-container">
      <span class="time" id="currentTime">0:00</span>
      <input type="range" id="progressBar" value="0" step="1" max="100">
      <span class="time" id="duration">0:00</span>
    </div>

    <div class="play-btn" id="playBtn">
      <span>▶</span>
    </div>
  </div>
</div>

<audio id="player">
  <source src="iris.mp3" type="audio/mpeg">
</audio>

<script>
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const vinyl = document.getElementById("vinyl");
const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

// Play/Pause logic
playBtn.addEventListener("click", () => {
  const isPlaying = player.paused;
  if (isPlaying) {
    player.play();
  } else {
    player.pause();
  }
});

player.onplay = () => {
  playBtn.innerHTML = "<span>❚❚</span>";
  vinyl.style.animationPlayState = "running";
};

player.onpause = () => {
  playBtn.innerHTML = "<span>▶</span>";
  vinyl.style.animationPlayState = "paused";
};

// Progress bar logic
player.addEventListener("timeupdate", () => {
  const progress = (player.currentTime / player.duration) * 100;
  progressBar.value = progress;
  currentTimeEl.textContent = formatTime(player.currentTime);
});

progressBar.addEventListener("input", () => {
  const seekTime = (progressBar.value / 100) * player.duration;
  player.currentTime = seekTime;
});

// Load song duration
player.addEventListener("loadedmetadata", () => {
  durationEl.textContent = formatTime(player.duration);
  progressBar.max = player.duration;
  progressBar.value = 0;
});
</script>

</body>
</html>
