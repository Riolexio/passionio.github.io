<!DOCTYPE html>
<html>
<head>
  <title>Iris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #5a443a, #1a1411 75%);
  font-family: 'Montserrat', sans-serif;
  color: #f5e6d3;
  overflow: hidden;
}

/* ================= FLOATING OBJECTS ================= */

.floating {
  position: absolute;
  font-size: 64px;
  opacity: 0.25;
}

.obj1 { left: 10%; animation: floatUp 45s linear infinite; color:#ff8fab; }
.obj2 { right: 15%; animation: floatDown 55s linear infinite; color:#90e0ef; }
.obj3 { top: 20%; animation: floatSide 60s linear infinite; color:#ffd166; }
.obj4 { left: 70%; animation: floatUp 50s linear infinite; color:#caffbf; }
.obj5 { right: 40%; animation: floatDown 65s linear infinite; color:#bdb2ff; }

@keyframes floatUp {
  0% { transform: translateY(120vh) rotate(0deg); }
  100% { transform: translateY(-120vh) rotate(360deg); }
}
@keyframes floatDown {
  0% { transform: translateY(-120vh) rotate(0deg); }
  100% { transform: translateY(120vh) rotate(-360deg); }
}
@keyframes floatSide {
  0% { transform: translateX(-120vw) rotate(0deg); }
  100% { transform: translateX(120vw) rotate(360deg); }
}

/* ================= PLAYER ================= */

.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 2;
}

.vinyl {
  position: relative;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, #222 0%, #111 8%, transparent 8%),
    repeating-radial-gradient(circle at center,
      #1a1a1a 0px,
      #1a1a1a 2px,
      #2a2a2a 3px,
      #1a1a1a 4px
    );
  box-shadow: 0 0 50px rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  animation: spin 6s linear infinite;
  animation-play-state: paused;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.vinyl::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, #b08968, #7f5539);
}

.album {
  position: absolute;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid #e6ccb2;
  z-index: 3;
}

h1 {
  font-family: 'Playfair Display', serif;
  margin-top: 35px;
  font-size: 34px;
}

p {
  margin-top: 5px;
  color: #e6ccb2;
}

/* ✅ Spotify-style progress */

.progress-container {
  width: 380px;
  margin-top: 25px;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}

.progress {
  height: 100%;
  width: 0%;
  background: #ffcf7d;
  border-radius: 5px;
}

/* Play button */

.play-btn {
  margin-top: 30px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffcf7d, #b06a2b);
  box-shadow: 0 0 30px rgba(255,180,100,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.play-btn span {
  font-size: 28px;
  color: #3b2f2f;
}

</style>
</head>
<body>

<div class="floating obj1">📼</div>
<div class="floating obj2">💿</div>
<div class="floating obj3">📻</div>
<div class="floating obj4">🎧</div>
<div class="floating obj5">🎶</div>

<div class="wrapper">

  <div class="vinyl" id="vinyl">
    <img src="IRIS- goo goo dolls.jpg" class="album">
  </div>

  <h1>Iris</h1>
  <p>Goo Goo Dolls</p>

  <div class="progress-container">
    <div class="time-row">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="play-btn" id="playBtn">
    <span>▶</span>
  </div>

</div>

<audio id="audio">
  <source src="iris.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const vinyl = document.getElementById("vinyl");
const progressBar = document.getElementById("progressBar");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return m + ":" + (s<10?"0"+s:s);
}

audio.addEventListener("loadedmetadata", ()=>{
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", ()=>{
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
  current.textContent = formatTime(audio.currentTime);
});

/* ✅ Click to seek like Spotify */
progressBar.addEventListener("click", (e)=>{
  const width = progressBar.clientWidth;
  const clickX = e.offsetX;
  const durationTime = audio.duration;

  audio.currentTime = (clickX / width) * durationTime;
});

playBtn.addEventListener("click", ()=>{
  if(audio.paused){
    audio.play();
    vinyl.style.animationPlayState="running";
    playBtn.innerHTML="<span>❚❚</span>";
  } else {
    audio.pause();
    vinyl.style.animationPlayState="paused";
    playBtn.innerHTML="<span>▶</span>";
  }
});
</script>

</body>
</html>
